<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — Cabinet pédiatrique Dor Djoolliany</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: var(--color-bg-tint); min-height: 100vh; }
  .admin-header { background: #fff; border-bottom: 1px solid var(--color-line); padding: 18px 0; }
  .admin-header .wrap { display: flex; align-items: center; justify-content: space-between; }
  .admin-title { font-family: var(--font-display); font-size: 1.2rem; color: var(--color-primary-dark); margin: 0; }
  .admin-main { padding: 40px 0 80px; }

  /* Écran de connexion */
  .login-box { max-width: 380px; margin: 60px auto; background: #fff; border: 1px solid var(--color-line); border-radius: 14px; padding: 32px; box-shadow: var(--shadow-sm); }
  .login-box h2 { margin-bottom: 8px; }
  .login-box p { color: var(--color-text-muted); font-size: 0.9rem; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1.5px solid var(--color-line); font-family: var(--font-body); font-size: 0.95rem; margin-bottom: 14px; }
  .login-error { color: #9B2C2C; font-size: 0.85rem; margin-top: 10px; display: none; }
  .login-error.show { display: block; }

  /* Barre d'outils */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .toolbar-filters { display: flex; gap: 10px; flex-wrap: wrap; }
  .toolbar select, .toolbar input[type="date"] { padding: 9px 12px; border-radius: 8px; border: 1.5px solid var(--color-line); font-family: var(--font-body); font-size: 0.88rem; background: #fff; }
  .btn-small { padding: 7px 14px; font-size: 0.82rem; }
  .btn-outline { background: transparent; color: var(--color-primary-dark); border: 1.5px solid var(--color-line); }
  .btn-outline:hover { border-color: var(--color-primary); }

  /* Tableau des rendez-vous */
  .appt-list { display: flex; flex-direction: column; gap: 12px; }
  .appt-card { background: #fff; border: 1px solid var(--color-line); border-radius: 12px; padding: 18px 20px; display: grid; grid-template-columns: 100px 1.2fr 1fr 0.9fr auto; gap: 16px; align-items: center; }
  @media (max-width: 900px) { .appt-card { grid-template-columns: 1fr; } }
  .appt-when { font-family: var(--font-mono); }
  .appt-when .date { font-weight: 600; color: var(--color-primary-dark); font-size: 0.92rem; }
  .appt-when .time { color: var(--color-text-muted); font-size: 0.82rem; }
  .appt-child { font-weight: 600; font-size: 0.95rem; }
  .appt-child .dob { font-weight: 400; color: var(--color-text-muted); font-size: 0.8rem; font-family: var(--font-mono); }
  .appt-parent { font-size: 0.88rem; color: var(--color-text-muted); }
  .appt-parent .name { color: var(--color-text); font-weight: 500; }
  .appt-reason { font-size: 0.85rem; }
  .status-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; font-family: var(--font-mono); }
  .status-en_attente { background: #FBEEE7; color: var(--color-terracotta-dark); }
  .status-confirme { background: #EAF5EF; color: #2C6E4F; }
  .status-annule { background: #F1F1F1; color: #777; text-decoration: line-through; }
  .appt-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--color-text-muted); }
  .loading-state { text-align: center; padding: 40px; color: var(--color-text-muted); font-family: var(--font-mono); font-size: 0.85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="admin-header">
  <div class="wrap">
    <p class="admin-title">Administration — Cabinet pédiatrique Dor Djoolliany</p>
    <button class="btn btn-small btn-outline" id="logoutBtn" hidden>Se déconnecter</button>
  </div>
</header>

<main class="admin-main">
  <div class="wrap">

    <!-- Écran de connexion -->
    <section id="loginScreen">
      <div class="login-box">
        <h2>Accès administrateur</h2>
        <p>Entrez la clé d'administration pour consulter les demandes de rendez-vous.</p>
        <input type="password" id="adminKeyInput" placeholder="Clé d'administration" autocomplete="off">
        <button class="btn btn-primary btn-block" id="loginBtn">Se connecter</button>
        <p class="login-error" id="loginError">Clé incorrecte. Réessayez.</p>
      </div>
    </section>

    <!-- Tableau de bord -->
    <section id="dashboard" hidden>
      <div class="toolbar">
        <div class="toolbar-filters">
          <select id="statusFilter">
            <option value="">Tous les statuts</option>
            <option value="en_attente">En attente</option>
            <option value="confirme">Confirmé</option>
            <option value="annule">Annulé</option>
          </select>
          <input type="date" id="dateFilter">
          <button class="btn btn-small btn-outline" id="clearFilters">Réinitialiser</button>
        </div>
        <button class="btn btn-small btn-outline" id="refreshBtn">Actualiser</button>
      </div>

      <div id="loadingState" class="loading-state">Chargement des rendez-vous…</div>
      <div id="emptyState" class="empty-state" hidden>Aucun rendez-vous ne correspond à ces critères.</div>
      <div id="apptList" class="appt-list"></div>
    </section>

  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
